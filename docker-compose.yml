services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_USER: birostweb
      MYSQL_DATABASE: birostweb
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Configure MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Configure MYSQL_ROOT_PASSWORD in .env}
    ports: ["127.0.0.1:53306:3306"]
    volumes: ["mysql_data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
  app:
    build: .
    restart: unless-stopped
    profiles: ["production"]
    init: true
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://birostweb:${MYSQL_PASSWORD}@db:3306/birostweb
      PORT: 3001
      STORAGE_PATH: /app/storage
      SEED_DEMO: "false"
    ports: ["127.0.0.1:3001:3001"]
    volumes: ["documents:/app/storage"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  mysql_data:
  documents:
